<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga Soccer Social</title>
    {% load static %}
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-100 flex flex-col items-center justify-center relative">
    <!-- Background image layer -->
    <div class="absolute inset-0 bg-[url('{% static 'images/soccer_social.JPG' %}')] bg-no-repeat bg-left-top" style="background-size: 25px 25px;"></div>
    <img src="{% static 'images/soccer_social.JPG' %}" alt="Test" style="width: 55px; height: 55px; position: fixed; top: 10px; left: 10px; z-index: 1000;">

    <!-- Main content wrapper -->
    <div class="relative z-10 w-full max-w-4xl p-4">
        <header class="bg-primary-blue text-white p-4 rounded-t-lg flex justify-between items-center">
            <h1 class="text-2xl font-bold"><a href="{% url 'league_selection' %}">Liga Soccer Social</a></h1>
            {% if user.is_authenticated %}
                <form action="{% url 'logout' %}" method="post" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="bg-primary-red hover:bg-red-700 text-white font-bold py-2 px-4 rounded text-sm">
                        Logout
                    </button>
                </form>
            {% endif %}
        </header>
        <main class="bg-white p-6 rounded-b-lg shadow-md">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
