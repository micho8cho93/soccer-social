<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga Soccer Social</title>
    {% load static %}
    <link rel="icon" type="image/jpeg" href="{% static 'images/soccer_social.JPG' %}">
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-100 flex flex-col items-center justify-center pt-24">
    <div class="w-full max-w-4xl p-4">
        <img src="{% static 'images/soccer_social.JPG' %}" alt="Test" class="w-12 h-12 md:w-20 md:h-20 fixed top-2 left-2 z-10">
        <header class="bg-primary-blue text-white p-4 rounded-t-lg flex justify-between items-center">
            <div class="flex items-center">
                <h1 class="text-2xl font-bold"><a href="{% url 'league_selection' %}">Liga Soccer Social</a></h1>
            </div>
            {% if user.is_authenticated %}
                <form action="{% url 'logout' %}" method="post" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="bg-primary-red hover:bg-red-700 text-white font-bold py-2 px-4 rounded text-sm">
                        Logout
                    </button>
                </form>
            {% endif %}
        </header>
        <main class="bg-white p-6 rounded-b-lg shadow-md">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
