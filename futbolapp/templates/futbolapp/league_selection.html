{% extends 'base.html' %}

{% block content %}
    <h1 class="text-2xl font-bold mb-4 text-center">Select a League or Tournament</h1>
    <form method="post" id="league_season_form" class="flex flex-col items-center space-y-4">
        {% if public_viewer %}
            <input type="hidden" id="public_viewer_flag" value="true">
        {% endif %}
        {% csrf_token %}
        <div class="w-full max-w-xs">
            <label for="type_select" class="block text-gray-700 text-sm font-bold mb-2">Type:</label>
            <select name="type" id="type_select" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <option value="">-- Select Type --</option>
                <option value="league" selected>League</option>
                <option value="tournament">Tournament</option>
            </select>
        </div>

        <div class="w-full max-w-xs" id="league_select_div" style="display: none;">
            <label for="league_select" class="block text-gray-700 text-sm font-bold mb-2">League:</label>
            <select name="league" id="league_select" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <option value="">-- Please choose a league --</option>
                {% for league in leagues %}
                    <option value="{{ league.id }}">{{ league.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="w-full max-w-xs" id="tournament_select_div" style="display: none;">
            <label for="tournament_select" class="block text-gray-700 text-sm font-bold mb-2">Tournament:</label>
            <select name="tournament" id="tournament_select" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <option value="">-- Please choose a tournament --</option>
                {% for season_obj in tournament_seasons %}
                    <option value="{{ season_obj.tournament.id }}" data-season-id="{{ season_obj.id }}">{{ season_obj.tournament.name }} ({{ season_obj.year }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="w-full max-w-xs">
            <label for="season_select" class="block text-gray-700 text-sm font-bold mb-2">Season:</label>
            <select name="season" id="season_select" disabled class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <option value="">-- Select a league/tournament first --</option>
            </select>
        </div>

        <button type="submit" id="submit_button" disabled class="bg-primary-blue hover:bg-primary-red text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline border border-primary-blue">
            Go
        </button>
        {% if public_viewer %}
        <div class="mt-4 text-center">
            <a href="{% url 'login' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded inline-flex items-center">
                Login
            </a>
        </div>
        {% endif %}
    </form>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const typeSelect = document.getElementById('type_select');
            const leagueSelectDiv = document.getElementById('league_select_div');
            const leagueSelect = document.getElementById('league_select');
            const tournamentSelectDiv = document.getElementById('tournament_select_div');
            const tournamentSelect = document.getElementById('tournament_select');
            const seasonSelect = document.getElementById('season_select');
            const submitButton = document.getElementById('submit_button');
            const form = document.getElementById('league_season_form');

            const updateVisibility = () => {
                const selectedType = typeSelect.value;
                leagueSelectDiv.style.display = selectedType === 'league' ? 'block' : 'none';
                tournamentSelectDiv.style.display = selectedType === 'tournament' ? 'block' : 'none';
                seasonSelect.disabled = true;
                submitButton.disabled = true;
                seasonSelect.innerHTML = '<option value="">-- Select a league/tournament first --</option>';

                // Reset selected values when type changes
                leagueSelect.value = '';
                tournamentSelect.value = '';
            };

            typeSelect.addEventListener('change', updateVisibility);

            leagueSelect.addEventListener('change', function() {
                const leagueId = this.value;
                seasonSelect.innerHTML = '<option value="">-- Loading seasons --</option>';
                seasonSelect.disabled = true;
                submitButton.disabled = true;

                if (leagueId) {
                    const isPublicViewer = document.getElementById('public_viewer_flag');
                    const baseUrl = isPublicViewer ? '/public' : '/futbol';
                    fetch(`${baseUrl}/get_seasons/${leagueId}/`)
                        .then(response => response.json())
                        .then(data => {
                            seasonSelect.innerHTML = '<option value="">-- Select a season --</option>';
                            data.forEach(season => {
                                const option = document.createElement('option');
                                option.value = season.id;
                                option.textContent = season.year;
                                seasonSelect.appendChild(option);
                            });
                            seasonSelect.disabled = false;
                        })
                        .catch(error => {
                            console.error('Error fetching seasons:', error);
                            seasonSelect.innerHTML = '<option value="">-- Error loading seasons --</option>';
                        });
                } else {
                    seasonSelect.innerHTML = '<option value="">-- Select a league first --</option>';
                }
            });

            tournamentSelect.addEventListener('change', function() {
                const selectedOption = this.options[this.selectedIndex];
                const tournamentId = selectedOption.value;
                const seasonId = selectedOption.dataset.seasonId; // Get season ID from data attribute

                seasonSelect.innerHTML = ''; // Clear existing options
                if (tournamentId && seasonId) {
                    const option = document.createElement('option');
                    option.value = seasonId;
                    option.textContent = selectedOption.textContent.match(/\((\d{4})\)/)[1]; // Extract year using regex
                    seasonSelect.appendChild(option);
                    seasonSelect.disabled = false;
                    submitButton.disabled = false;
                } else {
                    seasonSelect.innerHTML = '<option value="">-- Select a tournament first --</option>';
                    seasonSelect.disabled = true;
                    submitButton.disabled = true;
                }
            });

            seasonSelect.addEventListener('change', function() {
                // This listener is primarily for league selection, but ensures button state for both
                if (this.value) {
                    submitButton.disabled = false;
                } else {
                    submitButton.disabled = true;
                }
            });

            form.addEventListener('submit', function(event) {
                event.preventDefault();
                const selectedType = typeSelect.value;
                const isPublicViewer = document.getElementById('public_viewer_flag');
                const baseUrl = isPublicViewer ? '/public' : '/futbol';

                if (selectedType === 'league') {
                    const leagueId = leagueSelect.value;
                    const seasonId = seasonSelect.value;
                    if (leagueId && seasonId) {
                        window.location.href = `${baseUrl}/league/${leagueId}/${seasonId}/`;
                    }
                } else if (selectedType === 'tournament') {
                    const tournamentId = tournamentSelect.value;
                    const seasonId = seasonSelect.value; // Now seasonSelect has the correct seasonId for tournaments
                    if (tournamentId && seasonId) {
                        window.location.href = `${baseUrl}/tournament/${tournamentId}/${seasonId}/`;
                    }
                }
            });

            // Initial visibility update
            updateVisibility();
            // Trigger change event on typeSelect to ensure correct dropdown is shown
            typeSelect.dispatchEvent(new Event('change'));

            // If league is initially selected, trigger change on leagueSelect to load seasons
            if (typeSelect.value === 'league') {
                leagueSelect.dispatchEvent(new Event('change'));
            }
        });
    </script>
{% endblock %}
