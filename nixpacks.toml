[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "python312Packages.virtualenv", "nodejs", "postgresql"]

[phases.install]
cmds = [
  "npm install",
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "npm run build:css",
  ". /opt/venv/bin/activate && python manage.py collectstatic --no-input --clear"
]

[start]
cmd = ". /opt/venv/bin/activate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"