[phases.setup]
nixPkgs = ['python312', 'postgresql', 'nodejs', 'python312Packages.pip']

[phases.install]
cmds = [
  'npm ci',
  'python3.12 -m pip install -r requirements.txt'
]

[phases.build]
cmds = [
  'npm run build:css',
  'python3.12 manage.py collectstatic --no-input --clear'
]

[start]
cmd = 'gunicorn config.wsgi --log-file -'
